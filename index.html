<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pagamento: nome</title>
		<link rel="stylesheet" href="styles.css" />
		<script src="math.js"></script>
		<script src="jspdf.umd.min.js"></script>
		<script src="jspdf.plugin.autotable.min.js"></script>
		<link rel="stylesheet" href="css/all.min.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<div class="pagina" id="nomes">
			<h1>Calcular pagamento de panhadores</h1>
			<h2>
				Nome <br />
				do panhador
			</h2>
			<textarea id="campoNome" placeholder="Nome" type="text"></textarea>
			<div class="botoes">
				<div class="botaoComposto">
					<a id="pular"><i class="fa-solid fa-forward"></i></a>
					<p>Pular</p>
				</div>
				<div class="botaoComposto">
					<a id="nomePronto"><i class="fa-solid fa-check"></i></a>
					<p>Pronto</p>
				</div>
			</div>
		</div>

		<div class="pagina" id="calculadora">
			<h2 id="etapa"></h2>
			<div class="visor">
				<textarea
					id="campoCalculadora"
					type="text"
					placeholder="Preço por latão (R$/latão)"
				></textarea>
				<button>
					<i class="fa-solid fa-eraser"></i>
				</button>
			</div>
			<div class="linha">
				<button class="numero">7</button>
				<button class="numero">8</button>
				<button class="numero">9</button>
			</div>
			<div class="linha">
				<button class="numero">4</button>
				<button class="numero">5</button>
				<button class="numero">6</button>
			</div>
			<div class="linha">
				<button class="numero">1</button>
				<button class="numero">2</button>
				<button class="numero">3</button>
			</div>
			<div class="linha">
				<a id="mais" class="numero">+</a>
				<button class="numero">0</button>
				<button id="numeroPronto">
					<i class="fa-solid fa-check"></i>
				</button>
			</div>
		</div>
		<div class="pagina" id="resultados">
			<h2>Total</h2>
			<table>
				<thead>
					<tr>
						<th id="thnomes">Nomes</th>
						<th id="thvalores">Valores a Receber</th>
					</tr>
				</thead>
				<tbody id="tabela">
					<td>dw</td>
					<td>nidxoiwn</td>
				</tbody>
			</table>
			<button id="reiniciar">
				<i class="fa-solid fa-arrows-spin"></i>
			</button>
			<button id="exportar"></button>
		</div>
	</body>
</html>
