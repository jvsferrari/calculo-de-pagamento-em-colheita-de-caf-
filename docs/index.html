<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Panha de café</title>
		<link rel="stylesheet" href="styles.css" />
		<script src="math.js"></script>
		<script src="jspdf.umd.min.js"></script>
		<script src="jspdf.plugin.autotable.min.js"></script>
		<link rel="stylesheet" href="css/all.min.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<div class="pagina" id="nomes">
			<h1>Calcular pagamento</h1>
			<h2>
				Nome <br />
				do panhador
			</h2>
			<div id="campoNome" placeholder="Nome" contenteditable="true"></div>
			<div class="botoes">
				<div class="botaoComposto">
					<a id="pular"><i class="fa-solid fa-forward"></i></a>
					<p>Pular</p>
				</div>
				<div class="botaoComposto">
					<a id="nomePronto"><i class="fa-solid fa-check"></i></a>
					<p>Pronto</p>
				</div>
				<div class="botaoComposto" id="mudarPreco">
					<a><i class="fa-solid fa-dollar-sign"></i></a>
					<p>Preço diferente</p>
				</div>
			</div>
		</div>

		<div class="pagina" id="calculadora">
			<div id="etapa"></div>
			<div class="visor">
				<div id="campos">
					<div
						id="campoInteiro"
						placeholder="R$"
						contenteditable="true"
					></div>
					<div
						id="campoDecimal"
						placeholder=""
						contenteditable="true"
					></div>
				</div>
				<div class="desfazer">
					<button id="borracha">
						<i class="fa-solid fa-eraser"></i>
					</button>
					<button class="voltar">
						<i class="fa-solid fa-rotate-left"></i>
					</button>
				</div>
			</div>
			<div class="linha">
				<button class="numero">7</button>
				<button class="numero">8</button>
				<button class="numero">9</button>
			</div>
			<div class="linha">
				<button class="numero">4</button>
				<button class="numero">5</button>
				<button class="numero">6</button>
			</div>
			<div class="linha">
				<button class="numero">1</button>
				<button class="numero">2</button>
				<button class="numero">3</button>
			</div>
			<div class="linha">
				<a id="mais" class="numero">+</a>
				<button class="numero">0</button>
				<button id="numeroPronto">
					<i class="fa-solid fa-check"></i>
				</button>
			</div>
		</div>
		<div class="pagina" id="resultados">
			<h1>Total</h1>
			<table class="escondido" id="tabelaToda">
				<thead>
					<tr>
						<th id="thnomes">Nomes</th>
						<th id="thvalores">Valores a Receber</th>
						<th class="quantidadeCafe">Quantidade colhida</th>
					</tr>
				</thead>
				<tbody id="tabela"></tbody>
			</table>
			<div class="botoes">
				<div class="botaoComposto">
					<button id="reiniciar">
						<i class="fa-solid fa-plus"></i>
					</button>
					<p>Adicionar</p>
				</div>
				<div class="botaoComposto">
					<button id="zerar">
						<i class="fa-solid fa-trash"></i>
					</button>
					<p>Zerar</p>
				</div>

				<div class="botaoComposto">
					<button id="baixar">
						<i class="fa-solid fa-download"></i>
					</button>
					<p>Baixar</p>
				</div>
				<div class="botaoComposto">
					<button id="compartilhar">
						<i class="fa-solid fa-share"></i>
					</button>
					<p>Enviar</p>
				</div>
			</div>
		</div>
		<div id="confirmar" class="pagina">
			<h1>Calcular pagamento</h1>
			<h2>Finalizar?</h2>
			<div class="botaoComposto">
				<button id="adicionar">
					<i class="fa-solid fa-plus"></i>
				</button>
				<p>Adicionar</p>
			</div>
			<div class="botaoComposto">
				<button class="voltar">
					<i class="fa-solid fa-rotate-left"></i>
				</button>
				<p>Voltar</p>
			</div>
			<div class="botaoComposto">
				<button id="finalizar">
					<i class="fa-solid fa-check"></i>
				</button>
				<p>Finalizar</p>
			</div>
		</div>
	</body>
</html>
